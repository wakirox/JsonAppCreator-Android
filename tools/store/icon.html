<body><svg viewBox="18 18 72 72" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="108" height="108" fill="#FFF3EA"/>
  <rect x="31" y="35" width="26" height="38" rx="8" fill="#EF6B57"/>
  <rect x="61" y="35" width="16" height="17" rx="5" fill="#4D6B75"/>
  <rect x="61" y="56" width="16" height="17" rx="5" fill="#F4B740"/>
</svg></body></html>
