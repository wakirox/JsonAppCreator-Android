<!doctype html>
<!--
  One store screenshot: a caption on top and the app screen in a phone frame below it. Play's phone shots are
  1080×1920; App Store sizes come from the query (render-ios.sh): w×h is the page in layout pixels, ratio the
  capture's height over its width, radius the screen's corner as a share of its width, store=ios the iOS captions.
  Shots with `code` in captions.js show a JSON excerpt beside the phone, `split` shows it side by side with the screen it
  makes; `prompt` adds a chat bubble under the caption.
  Query: ?shot=gallery&src=raw/gallery.png[&w=1080&h=2347&ratio=2.173&radius=.125&store=ios]. Rendered by render.sh
  and render-ios.sh with headless Chrome.
-->
<html><head><meta charset="utf-8">
<script src="captions.js"></script>
<style>
  @font-face { font-family: GSF; src: url("fonts/google_sans_flex.ttf"); }
  :root { --coral: #ef6b57; --slate: #4d6b75; --ink: #f4f1ee; --bg: #121417; }
  html, body { margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: GSF, sans-serif;
    position: relative; }
  /* The icon's tiles, large and faint, in the top right corner behind the caption. */
  body::before { content: ""; position: absolute; width: 520px; height: 430px; right: -60px; top: -70px;
    background: url("tiles.svg") center / contain no-repeat; }
  .caption { position: absolute; left: 84px; right: 84px; top: 96px; }
  .kicker { font-size: 42px; color: var(--coral); margin-bottom: 18px;
    font-variation-settings: "wght" 600, "ROND" 100; }
  .headline { font-size: 82px; line-height: 1.05; font-variation-settings: "wght" 850, "wdth" 85, "opsz" 144; }
  .sub { font-size: 36px; line-height: 1.3; margin-top: 24px; color: #c9c4bf; font-variation-settings: "wght" 500; }
  .sub:empty { display: none; }
  .device { position: absolute; overflow: hidden; background: #000; border: 14px solid #2a2e33;
    border-radius: 64px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
  .device img { display: block; width: 100%; }
  .code { position: absolute; left: 56px; background: #1c2024; border: 2px solid #2f353b; border-radius: 32px;
    padding: 30px 30px 34px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); white-space: pre;
    font: 23px/1.45 "Noto Sans Mono", "DejaVu Sans Mono", monospace; color: #c9d1d9; }
  .code .k { color: #f0a58f; } .code .s { color: #a5d6a7; } .code .p { color: #6c7680; }
  /* The same corner radius as the phone beside it, with room inside the curves. */
  .code.split { font-size: 18px; line-height: 1.45; padding: 44px 26px; border-radius: 64px; overflow: hidden;
    box-sizing: border-box; }
  .note { position: absolute; left: 40px; right: 40px; font-size: 38px; line-height: 1.3; color: var(--ink);
    font-variation-settings: "wght" 500; }
  .label { position: absolute; font-size: 32px; color: var(--coral); font-variation-settings: "wght" 650, "ROND" 100; }
  .bubble { position: absolute; left: 56px; max-width: 760px; background: var(--coral); color: #1a0f0c;
    font-size: 36px; line-height: 1.25; padding: 26px 32px; border-radius: 34px 34px 34px 8px;
    font-variation-settings: "wght" 560; box-shadow: 0 20px 50px rgba(0, 0, 0, .45); }
</style></head>
<body>
<div class="caption" id="caption"><div class="kicker" id="kicker"></div><div class="headline" id="headline"></div><div class="sub" id="sub"></div></div>
<div class="device" id="device"><img id="screen"></div>
<script>
  const q = new URLSearchParams(location.search);
  const shot = q.get("shot") || "home";
  const c = { ...CAPTIONS.en[shot], ...(CAPTIONS[q.get("store")] || {})[shot] };
  const W = +(q.get("w") || 1080), H = +(q.get("h") || 1920);
  Object.assign(document.body.style, { width: W + "px", height: H + "px" });
  document.getElementById("kicker").textContent = c.kicker;
  document.getElementById("headline").textContent = c.headline;
  document.getElementById("sub").textContent = c.sub || "";
  document.getElementById("screen").src = q.get("src");

  // JSON syntax colours: keys, string values, punctuation.
  function highlight(json) {
    const esc = json.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return esc.replace(/("(?:[^"\\]|\\.)*")(\s*:)?|([{}\[\],])/g, (m, str, colon, punct) =>
      punct ? `<span class="p">${punct}</span>` : colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`);
  }

  const ratio = +(q.get("ratio") || 2400 / 1080);  // the raw captures
  const device = document.getElementById("device");
  const border = parseFloat(getComputedStyle(device).borderTopWidth);
  // The frame's corner follows the screen's own (the iPhone Duo's outer screen is nearly square-cornered).
  const corner = width => q.get("radius") ? { borderRadius: +q.get("radius") * width + border + "px" } : {};

  document.fonts.ready.then(() => {
    // The phone starts under the tallest caption of the whole set, so it's the same size in every shot.
    const caption = document.getElementById("caption");
    let top = 412;
    for (const name of Object.keys(CAPTIONS.en)) {
      const other = { ...CAPTIONS.en[name], ...(CAPTIONS[q.get("store")] || {})[name] };
      if (other.split) continue;  // laid out on its own
      const probe = caption.cloneNode(true);
      probe.removeAttribute("id");
      probe.style.visibility = "hidden";
      probe.children[0].textContent = other.kicker;
      probe.children[1].textContent = other.headline;
      probe.children[2].textContent = other.sub || "";
      document.body.appendChild(probe);
      top = Math.max(top, probe.getBoundingClientRect().bottom + 64);
      probe.remove();
    }
    // The prompt bubble first, under the caption.
    if (c.prompt) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = c.prompt;
      bubble.style.top = top - 20 + "px";
      document.body.appendChild(bubble);
      top = bubble.getBoundingClientRect().bottom + 44;
    }
    if (c.split) {
      // Side by side: the JSON file on the left, what Appkin shows from it on the right, each under its label, the
      // pair centred in the space under the caption.
      const gap = 20, labelHeight = 58;
      top += 36;
      // 450 wide on a phone page; on a wide page as tall as fits above the note.
      let width = 450;
      if (W > H) width = Math.min((H - top - labelHeight - 2 * border - 150) / ratio, W * 0.6);
      const inner = width * ratio;
      const phoneLeft = W - 40 - width - 2 * border;
      const placed = [device];
      [["The JSON file", 40], ["What Appkin shows", phoneLeft]].forEach(([text, left]) => {
        const label = document.createElement("div");
        placed.push(label);
        label.className = "label";
        label.textContent = text;
        Object.assign(label.style, { top: top + "px", left: left + "px" });
        document.body.appendChild(label);
      });
      top += labelHeight;
      Object.assign(device.style, { width: width + "px", height: inner + "px", top: top + "px", left: phoneLeft + "px",
        ...corner(width) });
      const card = document.createElement("div");
      card.className = "code split";
      placed.push(card);
      card.innerHTML = highlight(CODE[c.split]);
      Object.assign(card.style, { top: top + "px", left: "40px", width: phoneLeft - gap - 40 + "px",
        height: inner + 2 * border + "px" });
      document.body.appendChild(card);
      if (c.note) {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = c.note;
        note.style.top = top + inner + 2 * border + 48 + "px";
        document.body.appendChild(note);
        placed.push(note);
      }
      // App Store pages are taller than Play's: the group sits in the middle of the space under the caption.
      if (q.has("h")) {
        const shift = (H - 56 - Math.max(...placed.map(e => e.getBoundingClientRect().bottom))) / 2;
        if (shift > 0) placed.forEach(e => { e.style.top = parseFloat(e.style.top) + shift + "px"; });
      }
      return;
    }
    if (!c.code) {
      // The whole phone, centred, from under the caption (and bubble) to the bottom margin.
      const inner = H - 56 - top - 2 * border, width = inner / ratio;
      Object.assign(device.style, { width: width + "px", height: inner + "px", top: top + "px",
        left: (W - width) / 2 - border + "px", ...corner(width) });
      return;
    }
    // The phone on the right, running off the bottom edge, and the JSON card over its lower part on the left, so the
    // top of the app stays visible.
    const width = 620, inner = width * ratio;
    Object.assign(device.style, { width: width + "px", height: inner + "px", top: top + "px",
      right: "48px" });
    const card = document.createElement("div");
    card.className = "code";
    card.innerHTML = highlight(CODE[c.code]);
    card.style.top = top + 470 + "px";
    document.body.appendChild(card);
  });
</script>
</body></html>
