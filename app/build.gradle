plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'it.sapienza.androidratio.appratio'
    compileSdk 36
    defaultConfig {
        applicationId "it.sapienza.androidratio.appratio"
        minSdk 27
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                def unitTestTempDirectory = layout.buildDirectory.dir('tmp/unit-tests').get().asFile
                doFirst { unitTestTempDirectory.mkdirs() }
                workingDir = project.projectDir
                systemProperty 'java.io.tmpdir', unitTestTempDirectory.absolutePath
                jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
                ]
                systemProperty 'recordScreenshots',
                    project.findProperty('recordScreenshots') ?: 'false'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main {
            // Package the canonical repository schema without maintaining a second copy.
            assets.srcDir rootProject.file('schema')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.8'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.20.0'
    implementation 'com.networknt:json-schema-validator:1.0.87'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4:1.6.8'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    debugImplementation "androidx.compose.ui:ui-test-manifest:1.6.8"
}

def configToValidate = providers.gradleProperty('config')
def runningConfigValidation = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'validateConfig'
}

tasks.withType(Test).configureEach {
    if (runningConfigValidation) {
        filter {
            includeTestsMatching 'it.sapienza.androidratio.appratio.ConfigSchemaValidationTest'
            includeTestsMatching 'it.sapienza.androidratio.appratio.ConfigurationValidatorTest'
        }
    }
    if (configToValidate.isPresent()) {
        def requestedConfig = rootProject.file(configToValidate.get())
        systemProperty 'jsonApp.config', requestedConfig.absolutePath
        inputs.file(requestedConfig)
            .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

tasks.register('validateConfig') {
    group = 'verification'
    description = 'Validates bundled v3 configurations and the JSON file supplied with -Pconfig=<path>.'
    dependsOn 'testDebugUnitTest'

    doFirst {
        if (!configToValidate.isPresent()) {
            throw new GradleException(
                'Missing configuration path. Use ./gradlew :app:validateConfig -Pconfig=path/to/app.json'
            )
        }
        def requestedConfig = rootProject.file(configToValidate.get())
        if (!requestedConfig.isFile()) {
            throw new GradleException("Configuration file does not exist: ${requestedConfig}")
        }
    }
}
