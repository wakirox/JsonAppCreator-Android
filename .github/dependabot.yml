version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '05:00'
      timezone: Europe/Bucharest
    open-pull-requests-limit: 3
    groups:
      gradle-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '05:30'
      timezone: Europe/Bucharest
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
