name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Derive release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo '::error::Release tags must use the vMAJOR.MINOR.PATCH format.'
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))

          if (( minor > 999 || patch > 999 )); then
            echo '::error::Release minor and patch components must be between 0 and 999.'
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo '::error::The derived Android versionCode is outside the supported range.'
            exit 1
          fi

          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Validate signing secret availability
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            joined=$(IFS=', '; echo "${missing[*]}")
            echo "::error::Missing required GitHub Actions secrets: $joined"
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run unit and screenshot tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Validate example configuration
        run: ./gradlew --no-daemon :app:validateConfig -Pconfig=examples/v3_static_catalog.json

      - name: Decode and validate signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore_path="$RUNNER_TEMP/json-app-creator-release.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_CONFIG_KEYS_BASE64: ${{ secrets.APP_CONFIG_KEYS_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/json-app-creator-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify, rename, and checksum APK
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_apk='app/build/outputs/apk/release/app-release.apk'
          if [[ ! -f "$release_apk" ]]; then
            echo '::error::The expected signed release APK was not produced.'
            exit 1
          fi

          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          if [[ -z "$apksigner_path" ]]; then
            echo '::error::Android apksigner was not found in the installed build tools.'
            exit 1
          fi
          "$apksigner_path" verify --verbose "$release_apk"

          asset_directory="$RUNNER_TEMP/release-assets"
          asset_name="JsonAppCreator-$RELEASE_TAG.apk"
          mkdir -p "$asset_directory"
          cp "$release_apk" "$asset_directory/$asset_name"
          (
            cd "$asset_directory"
            sha256sum "$asset_name" > "$asset_name.sha256"
          )
          echo "directory=$asset_directory" >> "$GITHUB_OUTPUT"

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JsonAppCreator-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/json-app-creator-release.keystore"

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JsonAppCreator-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Verify checksum and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release-assets
          sha256sum --check "JsonAppCreator-$RELEASE_TAG.apk.sha256"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "JsonAppCreator-$RELEASE_TAG.apk" \
              "JsonAppCreator-$RELEASE_TAG.apk.sha256" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "JsonAppCreator-$RELEASE_TAG.apk" \
              "JsonAppCreator-$RELEASE_TAG.apk.sha256" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
