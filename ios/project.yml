name: Appkin
options:
  bundleIdPrefix: app.wakirox
  deploymentTarget:
    iOS: "26.0"
targets:
  Appkin:
    type: application
    platform: iOS
    sources: [Appkin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wakirox.appkin
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Appkin
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
